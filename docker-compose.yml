version: "3"
services:
  app-net-api:
    build: ./
    container_name: deploy-rapido
    restart: always
    ports:
      - "9996:8080"
    networks:
      - prueba-deploy-net-rapido
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}

networks:
  jenking:
    driver: bridge